<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Kualitas Udara & AI Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 flex flex-col items-center">
  <h1 class="text-3xl font-bold mb-6 text-blue-400">Dasbor AQI & AI Assistant</h1>

  <!-- Dashboard Realtime -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl mb-6">
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center">
      <p class="text-gray-400 mb-2">Indeks AQI</p>
      <h2 id="aqi-val" class="text-5xl font-extrabold text-green-400">--</h2>
    </div>
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center">
      <p class="text-gray-400 mb-2">PM2.5 (µg/m³)</p>
      <h2 id="pm25-val" class="text-5xl font-extrabold text-yellow-400">--</h2>
    </div>
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center">
      <p class="text-gray-400 mb-2">CO2 (PPM)</p>
      <h2 id="co2-val" class="text-5xl font-extrabold text-red-400">--</h2>
    </div>
  </div>

  <p id="status-time" class="text-sm text-gray-500 mb-8">Menunggu data terbaru...</p>

  <!-- Section Chatbot AI -->
  <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 w-full max-w-4xl">
    <h2 class="text-xl font-bold mb-4 text-purple-400">🤖 Tanya AI Asisten Udara</h2>
    
    <div id="chat-box" class="h-64 overflow-y-auto bg-gray-900 p-4 rounded-lg mb-4 space-y-3 border border-gray-700 text-sm">
      <div class="bg-gray-800 p-3 rounded-lg max-w-xs text-gray-300">
        Halo! Tanya aku apa saja tentang tren dan analisis riwayat kualitas udara di lokasi ini.
      </div>
    </div>

    <div class="flex gap-2">
      <input type="text" id="chat-input" placeholder="Tanya AI (misal: Bagaimana tren AQI saat ini?)..." 
             class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500">
      <button onclick="sendQuestion()" id="send-btn" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-lg font-bold">Kirim</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rkhbttzscoqceeuemrlq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJraGJ0dHpzY29xY2VldWVtcmxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTIxNTUsImV4cCI6MjEwODI4ODE1NX0.T5SFF5XNgOYh2WF4JRIqJoGN02lT6pXhSAoPlXCQXqs';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function updateUI(data) {
      document.getElementById('aqi-val').innerText = data.aqi ?? '--';
      document.getElementById('pm25-val').innerText = data.pm25 ?? '--';
      document.getElementById('co2-val').innerText = data.co2 ?? '--';
      document.getElementById('status-time').innerText = 'Pembaruan terakhir: ' + new Date(data.created_at).toLocaleTimeString();
    }

    async function fetchLatestData() {
      const { data } = await _supabase
        .from('log_kualitas_udara')
        .select('*')
        .order('id', { ascending: false })
        .limit(1);

      if (data && data.length > 0) updateUI(data[0]);
    }

    _supabase
      .channel('schema-db-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'log_kualitas_udara' }, payload => {
        updateUI(payload.new);
      })
      .subscribe();

    fetchLatestData();

    // Fungsi Pengiriman Pesan ke Backend Gemini AI
    async function sendQuestion() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      const chatBox = document.getElementById('chat-box');
      const btn = document.getElementById('send-btn');

      chatBox.innerHTML += `<div class="bg-purple-600 p-3 rounded-lg max-w-xs ml-auto text-white">${message}</div>`;
      input.value = '';
      btn.disabled = true;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('http://127.0.0.1:3000/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        const answer = data.answer || 'Gagal mendapat jawaban.';

        chatBox.innerHTML += `<div class="bg-gray-800 p-3 rounded-lg max-w-md text-gray-200">${answer.replace(/\n/g, '<br>')}</div>`;
      } catch (err) {
        chatBox.innerHTML += `<div class="bg-red-800 p-3 rounded-lg max-w-xs text-white">Error koneksi server!</div>`;
      }

      btn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
